<!DOCTYPE html>
<html>
<head>
  <title>Kousik Portfolio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(to right, #000428, #004e92);
      color: white;
      text-align: center;
    }

    nav {
      background: #111;
      padding: 15px;
    }

    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      color: orange;
    }

    section {
      padding: 40px;
      animation: fadeIn 1s ease-in;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    .card {
      background: rgba(255,255,255,0.1);
      margin: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .btn {
      background: orange;
      padding: 10px 20px;
      color: black;
      text-decoration: none;
      border-radius: 20px;
      transition: 0.3s;
    }

    .btn:hover {
      background: white;
    }
  </style>
</head>

<body>

<nav>
  <a href="#">Home</a>
  <a href="#about">About</a>
  <a href="#skills">Skills</a>
  <a href="#contact">Contact</a>
</nav>

<section>
  <h1>🚀 Kousik Portfolio</h1>
  <h2>Hello, I'm Kousik 👋</h2>
  <p>I am learning Web Development 😎</p>
</section>

<section id="about">
  <div class="card">
    <h2>About Me</h2>
    <p>I am from India and learning website development using mobile 📱</p>
  </div>
</section>

<section id="skills">
  <div class="card">
    <h2>My Skills</h2>
    <p>HTML, CSS, JavaScript</p>
  </div>
</section>

<section id="contact">
  <div class="card">
    <h2>Contact Me</h2>
    <a class="btn" href="https://www.facebook.com/share/1J4QvYEGqd/">Facebook</a>
  </div>
</section>

</body>
</html>
